name: bigreminder

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  device_preview: ^1.3.1
  shared_preferences: ^2.5.4
  http: ^1.6.0
  flutter_riverpod: ^3.3.1
  json_annotation: ^4.11.0
  flutter_launcher_icons: ^0.14.4
  flutter_slidable: ^4.0.3
  math_expressions: ^2.4.0
  fl_chart: ^1.2.0
  file_picker: ^11.0.2
  csv: ^6.0.0
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  open_file: ^3.3.2



dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true

  assets:
     - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/biz_reminder_logos.png"
